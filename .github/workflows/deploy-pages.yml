# Deploys the built site to GitHub Pages on every push to main.
#
# The build injects VITE_DIGITRANSIT_API_KEY from the repo secret of the
# same name (human decision, coordinator thread 2026 session; to be
# recorded in ADR-0003): Vite inlines it into the served bundle, so the
# key MUST be domain/referer-restricted at digitransit.fi and treated as
# public - revocable and cheap to rotate, never a high-value secret.
# Do not put any other VITE_* value or a non-restricted key here, and do
# not replace the repo secret with a literal. Docs/deployment.md has the
# policy and verification steps.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
