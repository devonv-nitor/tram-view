<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mockup 4 — Minimal table card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f1f3f6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .mockup {
    width: 320px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    overflow: hidden;
  }

  /* Title row */
  .title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.85rem;
    border-bottom: 1px solid #e3e6eb;
  }
  .title__left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .title__badge {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: #fcb919;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    color: #1a1a1a;
  }
  .title__vehicle {
    font-weight: 600;
    font-size: 0.88rem;
    color: #1b1e22;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .title__gtfs {
    display: block;
    font-weight: 400;
    font-size: 0.65rem;
    color: #5a6169;
  }
  .title__headsign {
    font-size: 0.75rem;
    color: #5a6169;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Two-column table layout */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #e3e6eb;
  }
  .cell {
    background: #ffffff;
    padding: 0.55rem 0.75rem;
  }
  .cell--full {
    grid-column: 1 / -1;
  }

  .cell__label {
    display: block;
    color: #5a6169;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.1rem;
  }
  .cell__value {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    color: #1b1e22;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .cell__value--green { color: #1f7a4d; }
  .cell__value--red   { color: #b3261e; }
  .cell__value--amber { color: #a15c00; }

  /* Next stop: full-width row at the bottom */
  .next {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.85rem;
    background: #f7f8fa;
    border-top: 1px solid #e3e6eb;
  }
  .next__label {
    color: #5a6169;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .next__name {
    font-weight: 700;
    font-size: 1rem;
    color: #1b1e22;
  }
  .next__right {
    text-align: right;
  }
  .next__dl {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="mockup">
  <div class="title">
    <div class="title__left">
      <span class="title__badge">5</span>
      <div>
        <span class="title__vehicle">40/450</span>
        <span class="title__gtfs">HSL:1005</span>
      </div>
    </div>
    <span class="title__headsign">→ Katajanokka</span>
  </div>

  <div class="grid">
    <div class="cell">
      <span class="cell__label">Speed</span>
      <span class="cell__value">32 km/h</span>
    </div>
    <div class="cell">
      <span class="cell__label">Heading</span>
      <span class="cell__value">215° SW</span>
    </div>
    <div class="cell">
      <span class="cell__label">Doors</span>
      <span class="cell__value cell__value--green">Closed</span>
    </div>
    <div class="cell">
      <span class="cell__label">Deviation</span>
      <span class="cell__value cell__value--green">+12 s</span>
    </div>
  </div>

  <div class="next">
    <div>
      <span class="next__label">Next stop</span>
      <span class="next__name">Eira</span>
    </div>
    <div class="next__right">
      <span class="next__label">Schedule</span>
      <span class="next__dl cell__value--green">+12 s</span>
    </div>
  </div>
</div>
</body>
</html>
